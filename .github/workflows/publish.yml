name: Publish

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-24.04
    # The GitHub environment that castore's workload identity on hex.pm names
    environment: release
    permissions:
      contents: write # push the version tag
      id-token: write # the OIDC token mix hex.publish exchanges with Workload Identity
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install OTP and Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.19"

      - name: Publish
        run: |
          mix deps.get
          mix compile
          .github/workflows/publish.sh
